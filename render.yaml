services:
  - type: web
    name: kavachai
    runtime: node
    buildCommand: npm --prefix backend install
    startCommand: npm --prefix backend start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: HELMET_DEVICE_KEY
        sync: false
      - key: HELMET_DEVICE_USER_ID
        sync: false
      - key: ADMIN_EMAIL_1
        sync: false
      - key: ADMIN_PASSWORD_1
        sync: false
      - key: ADMIN_EMAIL_2
        sync: false
      - key: ADMIN_PASSWORD_2
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: TEXTBEE_API_KEY
        sync: false
  - type: web
    name: kavachai-device-api
    runtime: docker
    dockerfilePath: ./device-service/Dockerfile
    dockerContext: ./device-service
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_KEY
        generateValue: true
      - key: DEVICE_SECRET_PEPPER
        generateValue: true
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
